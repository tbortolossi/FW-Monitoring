vulnerabilities:
  - id: CVE-2026-78661
    paths:
      - usr/bin/telegraf
    expired_at: 2026-11-30
    statement: >-
      Telegraf 1.40.3 is the latest stable upstream release and embeds
      golang.org/x/net 0.61.0. This denial-of-service flaw is in the
      golang.org/x/net/html parser, but this stack enables only SNMP and
      execd inputs, which parse no HTML. Remove this exception as soon as an
      upstream Telegraf image built with golang.org/x/net 0.62.0 is
      available.
