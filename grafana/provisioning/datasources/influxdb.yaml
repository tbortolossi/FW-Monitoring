apiVersion: 1
datasources:
  - name: InfluxDB (Flux)
    uid: P951FEA4DE68E13C5   # keep this UID stable; dashboards reference it
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: ${INFLUX_BUCKET}
    secureJsonData:
      token: ${INFLUX_TOKEN}
    isDefault: true
