# Firewall inventory.
#
# Copy this file to firewalls.yml, edit the copy, then run:
#   ./generate.sh
#
# Keep this file simple: hostname, management IP, vendor, SNMP version,
# and SNMP credentials. generate.sh discovers versions, models, chassis
# status, VSYS/VDOM availability, and optional feature flags over SNMP.
#
# Secrets are exact ${VARIABLE} references resolved from .env (see
# .env.example). Direct values also work but keep secrets in this file.
# Use the firewall's own hostname (SNMP sysName) as hostname.

#####################################################
## SNMPv3 examples
#####################################################

- hostname: PA-440
  host: 192.0.2.101
  vendor: paloalto
  snmp_version: 3
  username: snmpv3_user
  auth_protocol: sha256
  auth_password: ${PA_440_SNMP_AUTH}
  priv_protocol: aes256
  priv_password: ${PA_440_SNMP_PRIV}
  # Optional PAN-OS XML API performance monitoring. Put the key in .env and
  # reference it below. Run paloalto_api_key.py to generate both entries.
  api_monitoring:
    enabled: false
    # Optional when the API uses a different address from the SNMP host:
    # host: 192.0.2.201
    api_key: ${PALOALTO_API_KEY_PA_440}
    verify_tls: true
    interval: 20
    resource_interval: 60
    counter_interval: 60
    # Maximum active severity=drop counter series retained per firewall.
    counter_limit: 256
  # Advanced overrides (Palo Alto only). Leave them out: generate.sh infers
  # them from the discovered model and PAN-OS version. A value set here
  # always wins over discovery.
  # chassis: true                # modular chassis; enables ENTITY sensor/state tables
  # pa_cluster: true             # PA-cluster member; polls pan_pa_cluster (never inferred, default false)
  # panos_10_2_metrics: false    # PAN-OS 10.2+ per-interface CPS table (panIfTable)
  # panos_11_2_metrics: false    # PAN-OS 11.2+ panhrStorageUsage storage percentage
  # panos_12_metrics: false      # PAN-OS 12.1+ objects (with vsys_total_cps)
  # vsys_total_cps: false        # PAN-OS 12.1+ per-VSYS total CPS
  # interface_utilization: false # PAN-OS 12.1+ panInterfaceUtilizationTable
  # panos_version: "11.2.4"      # fallback only when SNMP discovery gets no answer

- hostname: FGT-80F
  host: 192.0.2.102
  vendor: fortinet
  snmp_version: 3
  username: snmpv3_user
  auth_protocol: sha256
  auth_password: ${FGT_80F_SNMP_AUTH}
  priv_protocol: aes256
  priv_password: ${FGT_80F_SNMP_PRIV}

