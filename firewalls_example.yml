# Firewall inventory.
#
# Copy this file to firewalls.yml, edit the copy, then run:
#   ./generate.sh
#
# Keep this file simple: hostname, management IP, vendor, SNMP version,
# and SNMP credentials. generate.sh discovers versions, models, chassis
# status, VSYS/VDOM availability, and optional feature flags over SNMP.

#####################################################
## SNMPv3 examples
#####################################################

- hostname: PA-440
  host: 192.0.2.101
  vendor: paloalto
  snmp_version: 3
  username: snmpv3_user
  auth_protocol: sha256
  auth_password: ${PA_440_SNMP_AUTH}
  priv_protocol: aes256
  priv_password: ${PA_440_SNMP_PRIV}
  # Optional PAN-OS XML API performance monitoring. Put the key in .env and
  # reference it below. Run paloalto_api_key.py to generate both entries.
  api_monitoring:
    enabled: false
    # Optional when the API uses a different address from the SNMP host:
    # host: 192.0.2.201
    api_key: ${PALOALTO_API_KEY_PA_440}
    verify_tls: true
    interval: 20
    resource_interval: 60
    counter_interval: 60
    # Maximum active severity=drop counter series retained per firewall.
    counter_limit: 256

- hostname: FGT-80F
  host: 192.0.2.102
  vendor: fortinet
  snmp_version: 3
  username: snmpv3_user
  auth_protocol: sha256
  auth_password: ${FGT_80F_SNMP_AUTH}
  priv_protocol: aes256
  priv_password: ${FGT_80F_SNMP_PRIV}

