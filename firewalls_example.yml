# Firewall inventory.
#
# Copy this file to firewalls.yml, edit the copy, then run:
#   ./generate.sh
#
# Keep this file simple: hostname, management IP, vendor, SNMP version,
# and SNMP credentials. generate.sh discovers versions, models, chassis
# status, VSYS/VDOM availability, and optional feature flags over SNMP.

#####################################################
## SNMPv3 examples
#####################################################

- hostname: PA-440
  host: 192.0.2.101
  vendor: paloalto
  snmp_version: 3
  username: snmpv3_user
  auth_protocol: sha256
  auth_password: CHANGE_ME_AUTH
  priv_protocol: aes256
  priv_password: CHANGE_ME_PRIV
  # Optional PAN-OS XML API performance monitoring. firewalls.yml is ignored
  # by Git, like the SNMP credentials. Run paloalto_api_key.py to generate the
  # key and switch enabled to true.
  api_monitoring:
    enabled: false
    # Optional when the API uses a different address from the SNMP host:
    # host: 192.0.2.201
    api_key: CHANGE_ME_PALO_ALTO_API_KEY
    # Alternative: store the key in .env and use this instead of api_key:
    # api_key_env: PALOALTO_API_KEY_PA_440
    verify_tls: true
    interval: 20
    resource_interval: 60
    counter_interval: 60

- hostname: FGT-80F
  host: 192.0.2.102
  vendor: fortinet
  snmp_version: 3
  username: snmpv3_user
  auth_protocol: sha256
  auth_password: CHANGE_ME_AUTH
  priv_protocol: aes256
  priv_password: CHANGE_ME_PRIV

